[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "pydantic-ai-slim[openai]>=0.0.14",
    "langfuse>=2.50",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "lxml>=5.3",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "jsonschema>=4.23",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-embeddings-openai>=0.3",
    "llama-index-embeddings-fastembed>=0.3",
    "ragas>=0.2,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
